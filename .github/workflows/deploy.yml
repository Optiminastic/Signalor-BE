name: Deploy backend (main)

# Build the image on push to main, push it to GHCR, then trigger a Coolify
# deployment (signalor now runs under Coolify — dashboard at deploy.signalor.ai —
# NOT the old standalone docker-compose stack). Coolify pulls the freshly built
# `:latest` image and recreates the web/worker/analysis-worker containers.
#
# Required repo secret:
#   COOLIFY_TOKEN  — Coolify API token with the `deploy` ability.
# Non-secret config is inlined in `env` below (URL + service uuid).
#
# The box must be able to pull the private GHCR image: run
#   docker login ghcr.io  (with a read:packages token)
# once on the server so Coolify's pull succeeds.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/optiminastic/signalor-be
  COOLIFY_URL: https://deploy.signalor.ai
  COOLIFY_SERVICE_UUID: d11oz4lylx5pgz8rtuj1ho3d

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # Persistent layer cache across runs — the Chromium/apt layers are
          # the slow part and rarely change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Manual approval gate (optional): configure required reviewers on this
    # GitHub Environment to make the deploy step a one-click approval.
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/coolify-resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_SERVICE_UUID}&force=true")
          echo "Coolify deploy HTTP ${code}"
          cat /tmp/coolify-resp; echo
          test "${code}" = "200"
