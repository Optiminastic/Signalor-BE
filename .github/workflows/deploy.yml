name: Deploy backend (main)

# Build the image on push to main, push it to GHCR, then trigger a Coolify
# deployment. Signalor runs as a Coolify service on server signalor-nbg1,
# managed from deploy.optiminastic.com (moved from the old deploy.signalor.ai
# panel on 2026-11-18). Coolify pulls the freshly built `:latest` image and
# recreates the service's containers (web, workers, growth workers, scheduler).
#
# Required repo secret:
#   COOLIFY_TOKEN  — Coolify API token with the `deploy` ability.
# Non-secret config is inlined in `env` below (URL + service uuid).
#
# The box must be able to pull the private GHCR image: run
#   docker login ghcr.io  (with a read:packages token)
# once on the server so Coolify's pull succeeds.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/optiminastic/signalor-be
  COOLIFY_URL: https://deploy.optiminastic.com
  COOLIFY_SERVICE_UUID: ijsynrscylkfu6umdwsixb5i

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # Persistent layer cache across runs — the Chromium/apt layers are
          # the slow part and rarely change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Manual approval gate (optional): configure required reviewers on this
    # GitHub Environment to make the deploy step a one-click approval.
    environment: production
    steps:
      # The server can't pull from GHCR on its own (no stored registry login), and
      # Coolify silently reuses a cached image when its pull fails. So pull the exact
      # image this run built, using this job's short-lived GITHUB_TOKEN (it expires
      # when the job ends; nothing stays on the server), and tag it :latest there
      # before Coolify recreates the containers. A failure here stops the deploy.
      - name: Pull the new image on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          REMOTE="docker login ghcr.io -u $GHCR_USER --password-stdin >/dev/null"
          REMOTE="$REMOTE && docker pull -q $IMAGE:$TAG && docker tag $IMAGE:$TAG $IMAGE:latest"
          REMOTE="$REMOTE; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$REMOTE"
          echo "Pulled $IMAGE:$TAG on the server and tagged it :latest."

      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/coolify-resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_SERVICE_UUID}&force=true")
          echo "Coolify deploy HTTP ${code}"
          cat /tmp/coolify-resp; echo
          test "${code}" = "200"
